[package]
name = "teryon"
version = "0.14.0"
edition = "2021"
rust-version = "1.89"
description = "Persistent remote workspaces over OpenSSH, built in Rust"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
vt100 = "0.16"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
clap_complete = "4.5"
regex = "1"

[features]
default = []
desktop = ["dep:eframe", "dep:image"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = false
strip = true

[patch.crates-io]
epaint = { path = "vendor/epaint" }
vt100 = { path = "vendor/vt100" }
