name: Build release archives
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features --locked
      - run: cargo build --release --features desktop --locked
      - name: Create archive with checksums
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p dist
          cp target/release/teryon dist/teryon
          cp LICENSE README.md dist/
          cd dist
          shasum -a 256 teryon > SHA256SUMS
          tar czf "teryon-${ARTIFACT}.tar.gz" teryon LICENSE README.md SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: teryon-${{ matrix.artifact }}
          path: dist/*.tar.gz
  macos-app:
    # Unsigned TERYON.app, built in CI so the Mac mini only has to sign and notarize it. The signing
    # certificates never leave that Mac. The result is a workflow artifact, never attached to a Release.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: scripts/bundle-macos.sh
      - name: Check the bundle
        run: |
          plutil -lint dist/TERYON.app/Contents/Info.plist
          test -x dist/TERYON.app/Contents/MacOS/teryon
          test -x dist/TERYON.app/Contents/MacOS/launch-teryon
          test -s dist/TERYON.app/Contents/Resources/Teryon.icns
          dist/TERYON.app/Contents/MacOS/teryon --version
      - name: Zip the unsigned app with a checksum
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cd dist
          ditto -c -k --keepParent TERYON.app "TERYON-${version}-unsigned.zip"
          shasum -a 256 "TERYON-${version}-unsigned.zip" > "SHA256SUMS-unsigned-${version}"
      - uses: actions/upload-artifact@v4
        with:
          name: teryon-macos-app-unsigned
          path: |
            dist/TERYON-*-unsigned.zip
            dist/SHA256SUMS-unsigned-*
  publish:
    # Only for a pushed tag: attach the archives and the changelog section to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) found = 1 }
            found { print }
          ' CHANGELOG.md | sed '1d' > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "TERYON ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
